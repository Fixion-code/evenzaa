  <!-- WebMCP (Model Context Protocol for Web Agents) Polyfill & Declarative/Imperative Tools -->
  <script>
  (function() {
    if (typeof window !== 'undefined') {
      window.navigator = window.navigator || {};
      if (!window.navigator.modelContext) {
        var tools = new Map();
        window.navigator.modelContext = {
          registerTool: function(name, tool) {
            tools.set(name, tool);
            return true;
          },
          getTools: function() {
            return Array.from(tools.entries()).map(function(e) { return Object.assign({ name: e[0] }, e[1]); });
          }
        };
      }
      // Register local business tools for AI search engines & agents (ChatGPT, Claude, Gemini, Perplexity)
      window.navigator.modelContext.registerTool("checkHours", {
        description: "Check working hours for Evenza Hospitality Services",
        parameters: {},
        execute: async function() {

        }
      });
      window.navigator.modelContext.registerTool("getDirections", {
        description: "Get physical location and address for Evenza headquarters in Jaipur",
        parameters: {},
        execute: async function() {
          return { address: "Choti Chaupad, Jaipur, Rajasthan 302002, India", geo: { latitude: 26.9124, longitude: 75.7873 }, landmark: "Near City Palace, Jaipur" };

      });

        description: "Book an event manpower consultation or request event crew quote",
